apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: linkforge
  labels:
    app: linkforge
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkforge
      tier: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: linkforge
        tier: web
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        # 101 is the nginx user inside the nginx-unprivileged image.
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: linkforge
              tier: web
      containers:
        - name: web
          image: __WEB_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "15"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Deliberately NOT read-only. The nginx entrypoint writes to
            # /etc/nginx and /var/cache/nginx on startup. The clean fix is to
            # serve the config from a ConfigMap and mount emptyDirs over both
            # paths -- a good exercise once the rest of this works.
            readOnlyRootFilesystem: false
